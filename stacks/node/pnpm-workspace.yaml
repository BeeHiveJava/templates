packages:
- apps/*
- packages/*

catalog:
  '@biomejs/biome': 2.6.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

# Route every Vite consumer (frameworks, plugins) through the Vite+ core
overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
  - vite
