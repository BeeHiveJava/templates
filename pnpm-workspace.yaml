packages:
  - apps/*
  - packages/*

catalog:
  "@beehivejava/config": github:beehivejava/templates#path:/packages/config
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0

# Route every Vite consumer (frameworks, plugins) through the Vite+ core
overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
