---
name: node

on:
  workflow_call:
    inputs:
      runs-on:
        description: The labels of the runner to run on, as a JSON array
        type: string
        default: '["ubuntu-latest"]'
      cache:
        description: Cache the toolchain and the task results between runs; off for a runner that keeps its own disk
        type: boolean
        default: true
      dry-run:
        description: Build without deploying, defaults to true everywhere except a push to main
        type: boolean
        # A pull_request run that starts after its PR merged gets refs/heads/main as its ref
        default: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    # A caller in another organisation gets nothing from `secrets: inherit`, so it passes them all as JSON
    secrets:
      SECRETS:
        description: Every secret of the caller, as `toJSON(secrets)`
        required: false

jobs:
  node:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: ${{ inputs.cache }}
          cache-toolchain: ${{ inputs.cache }}
      - uses: actions/cache@v6
        if: ${{ inputs.cache }}
        with:
          path: |
            node_modules/.vite/task-cache
            node_modules/.vitest-cache
          key: vite-task|${{ runner.os }}|${{ github.sha }}
          restore-keys: vite-task|${{ runner.os }}|
      - run: vp run lint
      - run: vp run test
      - run: vp run build
      - name: Run vp run deploy
        run: |
          secrets="$(jq -c '(.SECRETS // "{}" | fromjson) + del(.SECRETS) | del(.github_token)' <<< "$SECRETS")"
          jq -r '.[] | splits("\n") | select(length > 0) | "::add-mask::\(.)"' <<< "$secrets"
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' <<< "$secrets")"
          vp run deploy
        if: ${{ !inputs.dry-run }}
        env:
          SECRETS: ${{ toJSON(secrets) }}
