---
name: node

on:
  workflow_call:
    inputs:
      dry-run:
        description: Build without deploying, defaults to true everywhere except main
        type: boolean
        default: ${{ github.ref != 'refs/heads/main' }}

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - id: node
      name: Resolve Node.js version
      # setup-vp only caches the toolchain for an exact version, so resolve engines.node the way Vite+ does
      run: |
        range="$(jq -r '.engines.node // empty' package.json)"
        index="$(curl -fsSL --retry 3 --max-time 30 https://nodejs.org/dist/index.json)"
        resolve() { npx --yes semver@7 -r "$range" $(jq -r "$1" <<< "$index") | tail -n1; }
        version="$(resolve '.[] | select(.lts) | .version')"
        echo "version=${version:-$(resolve '.[].version')}" >> "$GITHUB_OUTPUT"
    - uses: voidzero-dev/setup-vp@v1.22.0
      with: { cache: true, cache-toolchain: true, node-version: "${{ steps.node.outputs.version }}" }
    - uses: actions/cache@v6
      with:
        path: |
          node_modules/.vite/task-cache
          node_modules/.vitest-cache
        key: vite-task|${{ runner.os }}|${{ github.sha }}
        restore-keys: vite-task|${{ runner.os }}|
    - run: vp run test
    - run: vp run build
    - name: Run vp run deploy
      run: |
        eval "$(jq -r 'del(.github_token) | to_entries[] | "export \(.key)=\(.value | @sh)"' <<< "$SECRETS")"
        vp run deploy
      if: ${{ !inputs.dry-run }}
      env:
        SECRETS: ${{ toJSON(secrets) }}
