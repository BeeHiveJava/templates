---
name: node

on:
  workflow_call:
    inputs:
      dry-run:
        description: Build without deploying, defaults to true everywhere except main
        type: boolean
        default: ${{ github.ref != 'refs/heads/main' }}

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: voidzero-dev/setup-vp@v1.22.0
      with: { cache: true }
    - uses: actions/cache@v6
      with:
        path: |
          node_modules/.vite/task-cache
          node_modules/.vitest-cache
        key: vite-task|${{ runner.os }}|${{ github.sha }}
        restore-keys: vite-task|${{ runner.os }}|
    - run: vp run lint
    - run: vp run test
    - run: vp run build
    - name: Run vp run deploy
      run: |
        eval "$(jq -r 'del(.github_token) | to_entries[] | "export \(.key)=\(.value | @sh)"' <<< "$SECRETS")"
        vp run deploy
      if: ${{ !inputs.dry-run }}
      env:
        SECRETS: ${{ toJSON(secrets) }}
