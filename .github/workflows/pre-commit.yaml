---
name: pre-commit

on:
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.2
    - uses: voidzero-dev/setup-vp@v1.22.0
      if: ${{ hashFiles('pnpm-workspace.yaml') != '' }}
      with: { cache: true, cache-toolchain: true }
    - uses: actions/cache@v6
      if: ${{ hashFiles('pnpm-workspace.yaml') != '' }}
      with:
        path: node_modules/.vite/task-cache
        key: vite-task|pre-commit|${{ runner.os }}|${{ github.sha }}
        restore-keys: vite-task|pre-commit|${{ runner.os }}|
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
    - run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
