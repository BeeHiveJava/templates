---
name: pre-commit

on:
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.3
    - id: node
      name: Resolve Node.js version
      if: ${{ hashFiles('pnpm-workspace.yaml') != '' }}
      # setup-vp only caches the toolchain for an exact version, so resolve engines.node the way Vite+ does
      run: |
        range="$(jq -r '.engines.node // empty' package.json)"
        index="$(curl -fsSL --retry 3 --max-time 30 https://nodejs.org/dist/index.json)"
        resolve() { npx --yes semver@7 -r "$range" $(jq -r "$1" <<< "$index") | tail -n1; }
        version="$(resolve '.[] | select(.lts) | .version')"
        echo "version=${version:-$(resolve '.[].version')}" >> "$GITHUB_OUTPUT"
    - uses: voidzero-dev/setup-vp@v1.22.0
      if: ${{ hashFiles('pnpm-workspace.yaml') != '' }}
      with: { cache: true, cache-toolchain: true, node-version: "${{ steps.node.outputs.version }}" }
    - uses: actions/cache@v6
      if: ${{ hashFiles('pnpm-workspace.yaml') != '' }}
      with:
        path: node_modules/.vite/task-cache
        key: vite-task|pre-commit|${{ runner.os }}|${{ github.sha }}
        restore-keys: vite-task|pre-commit|${{ runner.os }}|
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
    - run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
